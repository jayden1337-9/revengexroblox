name: Repackage Roblox as Delta

on:
  push:
    paths:
      - ".github/workflows/build-delta.yml"
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct GitHub Release asset URL for the original APK"
        required: false
        default: "https://github.com/jayden1337-9/revengexroblox/releases/download/apk-input/Delta-2.743.1136-02.apk"
        type: string

permissions:
  contents: read

jobs:
  repackage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and download input APK
        env:
          APK_URL: ${{ inputs.apk_url || 'https://github.com/jayden1337-9/revengexroblox/releases/download/apk-input/Delta-2.743.1136-02.apk' }}
        run: |
          case "$APK_URL" in
            https://github.com/jayden1337-9/revengexroblox/releases/download/*) ;;
            *)
              echo "Use a direct asset URL from this repository's GitHub Releases."
              exit 1
              ;;
          esac

          curl --fail --location --retry 3 "$APK_URL" --output original.apk
          test -s original.apk
          file original.apk
          unzip -t original.apk

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0 platforms;android-35

      - name: Download binary manifest editor
        run: |
          curl --fail --location --retry 3 \
            https://github.com/WindySha/ManifestEditor/releases/download/v2.0/ManifestEditor-2.0.jar \
            --output ManifestEditor.jar
          test -s ManifestEditor.jar

      - name: Prepare manifest permission rewriter
        run: |
          cat > PermissionRewriter.java <<'JAVA'
          import com.wind.meditor.core.FileProcesser;
          import com.wind.meditor.property.AttributeItem;
          import com.wind.meditor.property.ModificationProperty;
          import com.wind.meditor.utils.NodeValue;

          public class PermissionRewriter {
              public static void main(String[] args) {
                  if (args.length != 2) {
                      throw new IllegalArgumentException("Usage: PermissionRewriter input.apk output.apk");
                  }

                  ModificationProperty property = new ModificationProperty();
                  property.addManifestAttribute(
                      new AttributeItem(NodeValue.Manifest.PACKAGE, "com.delta.test").setNamespace(null)
                  );
                  property.addApplicationAttribute(
                      new AttributeItem(NodeValue.Application.LABEL, "Delta")
                  );

                  property.setPermissionMapper((type, permission) -> {
                      if (permission != null && permission.startsWith("com.roblox.client.")) {
                          return "com.delta.test." + permission.substring("com.roblox.client.".length());
                      }
                      return permission;
                  });

                  property.setAuthorityMapper(authority -> {
                      if ("com.roblox.client".equals(authority)) {
                          return "com.delta.test";
                      }
                      if (authority != null && authority.startsWith("com.roblox.client.")) {
                          return "com.delta.test." + authority.substring("com.roblox.client.".length());
                      }
                      return authority;
                  });

                  FileProcesser.processApkFile(args[0], args[1], property);
              }
          }
          JAVA

          javac -cp ManifestEditor.jar PermissionRewriter.java

      - name: Change package name, app label, and private permission namespace
        run: |
          java -cp ManifestEditor.jar:. PermissionRewriter original.apk modified-unsigned.apk

          test -s modified-unsigned.apk
          unzip -t modified-unsigned.apk

      - name: Add Android dispatcher bridge for the APK's obfuscated coroutines
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"

          # This APK already ships matching coroutines-core and coroutines-android 1.10.2.
          # R8 renamed MainDispatcherFactory to qu.s and AndroidDispatcherFactory to lu.a.
          # The core Android fast-loader looks up the original AndroidDispatcherFactory name,
          # so add a tiny public bridge that implements qu.s and delegates to the existing lu.a.
          test "$(unzip -p original.apk META-INF/kotlinx_coroutines_core.version)" = "1.10.2"
          test "$(unzip -p original.apk META-INF/kotlinx_coroutines_android.version)" = "1.10.2"
          unzip -p original.apk META-INF/services/qu.s | grep -Fx 'lu.a'
          unzip -p original.apk classes2.dex | strings | grep -F 'Lqu/s;'
          unzip -p original.apk classes2.dex | strings | grep -F 'Llu/a;'

          mkdir -p bridge-src/qu bridge-src/ku bridge-src/lu \
            bridge-src/kotlinx/coroutines/android bridge-stubs bridge-classes bridge-dex

          cat > bridge-src/qu/s.java <<'JAVA'
          package qu;
          public interface s {
              String a();
              ku.n2 b(java.util.List<?> factories);
              int c();
          }
          JAVA

          cat > bridge-src/ku/n2.java <<'JAVA'
          package ku;
          public class n2 {}
          JAVA

          cat > bridge-src/lu/a.java <<'JAVA'
          package lu;
          public final class a implements qu.s {
              public String a() { return null; }
              public ku.n2 b(java.util.List<?> factories) { return null; }
              public int c() { return 0; }
          }
          JAVA

          cat > bridge-src/kotlinx/coroutines/android/AndroidDispatcherFactory.java <<'JAVA'
          package kotlinx.coroutines.android;
          public final class AndroidDispatcherFactory implements qu.s {
              private final lu.a delegate = new lu.a();
              public AndroidDispatcherFactory() {}
              @Override public String a() {
                  return delegate.a();
              }
              @Override public ku.n2 b(java.util.List<?> factories) {
                  return delegate.b(factories);
              }
              @Override public int c() {
                  return delegate.c();
              }
          }
          JAVA

          javac -proc:none -source 8 -target 8 -d bridge-stubs \
            bridge-src/qu/s.java bridge-src/ku/n2.java bridge-src/lu/a.java
          jar cf bridge-stubs.jar -C bridge-stubs .
          javac -proc:none -source 8 -target 8 -cp bridge-stubs \
            -d bridge-classes \
            bridge-src/kotlinx/coroutines/android/AndroidDispatcherFactory.java

          "$BUILD_TOOLS/d8" --min-api 23 --lib "$ANDROID_JAR" \
            --classpath bridge-stubs.jar --output bridge-dex \
            bridge-classes/kotlinx/coroutines/android/AndroidDispatcherFactory.class
          test -s bridge-dex/classes.dex

          if unzip -Z1 modified-unsigned.apk | grep -qx 'classes5.dex'; then
            echo "classes5.dex already exists; refusing to overwrite an existing DEX file."
            exit 1
          fi

          cp bridge-dex/classes.dex classes5.dex
          zip -q -0 modified-unsigned.apk classes5.dex

          unzip -p modified-unsigned.apk classes5.dex | strings | \
            grep -F 'Lkotlinx/coroutines/android/AndroidDispatcherFactory;'
          unzip -p modified-unsigned.apk classes5.dex | strings | grep -F 'Lqu/s;'
          unzip -p modified-unsigned.apk classes5.dex | strings | grep -F 'Llu/a;'
          unzip -t modified-unsigned.apk

      - name: Verify manifest before signing
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging modified-unsigned.apk | tee manifest-check.txt
          grep -F "package: name='com.delta.test'" manifest-check.txt
          grep -F "application-label:'Delta'" manifest-check.txt

      - name: Align and sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          keytool -genkeypair -v \
            -keystore delta-signing.jks \
            -storepass android \
            -keypass android \
            -alias delta \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Local Repackaged App, OU=Android, O=Local, L=Unknown, ST=Unknown, C=US"

          "$BUILD_TOOLS/zipalign" -p -f 4 modified-unsigned.apk aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks delta-signing.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Delta.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose Delta.apk
          "$BUILD_TOOLS/aapt" dump badging Delta.apk | grep -F "package: name='com.delta.test'"
          test -s Delta.apk

      - name: Upload Delta APK
        uses: actions/upload-artifact@v4
        with:
          name: Delta-APK
          path: Delta.apk
          if-no-files-found: error
          retention-days: 7
